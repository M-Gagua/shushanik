<!DOCTYPE html>
<html>
<head>
    <title>შუშანიკის ღირებულებები</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">შუშანიკის წამება</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">დასაწყისი</a>
            <a class="nav-link" href="/introduction">მიმოხილვა</a>
            <a class="nav-link" href="/choice">არჩევანი</a>
            <a class="nav-link" href="/characters">პერსონაჟები</a>
            <a class="nav-link" href="/scale">სასწორი</a>
        </div>
    </div>
</nav>


<main class="container scale-page">

    <p class="opening-label">შუშანიკის ღირებულებები</p>

    <h1>რა იყო მისთვის ყველაზე მნიშვნელოვანი?</h1>

    <p class="scale-description">
        გადაიტანე ღირებულებები სასწორის სხვადასხვა მხარეს.
    </p>


    <!-- VALUE CUBES -->

    <div class="value-area">

        <div
            class="value-cube"
            draggable="true"
            data-value="faith"
        >
            რწმენა
        </div>

        <div
            class="value-cube"
            draggable="true"
            data-value="dignity"
        >
            ღირსება
        </div>

        <div
            class="value-cube"
            draggable="true"
            data-value="love"
        >
            სიყვარული
        </div>

        <div
            class="value-cube"
            draggable="true"
            data-value="freedom"
        >
            თავისუფლება
        </div>

        <div
            class="value-cube"
            draggable="true"
            data-value="power"
        >
            ძალაუფლება
        </div>

        <div
            class="value-cube"
            draggable="true"
            data-value="family"
        >
            ოჯახი
        </div>

        <div
            class="value-cube"
            draggable="true"
            data-value="kindness"
        >
            სიკეთე
        </div>

        <div
            class="value-cube"
            draggable="true"
            data-value="peace"
        >
            სიმშვიდე
        </div>

    </div>


    <!-- SCALE -->

    <div class="scale-wrapper">

        <div class="balance-scale" id="balanceScale">

            <div class="scale-beam">

                <div
                    class="scale-pan left-pan"
                    id="leftPan"
                    data-side="left"
                >
                </div>

                <div
                    class="scale-pan right-pan"
                    id="rightPan"
                    data-side="right"
                >
                </div>

            </div>

            <div class="scale-stand"></div>

        </div>

    </div>

</main>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>არჩევანი - შუშანიკის წამება</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- TOP NAVIGATION -->

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="/">
                შუშანიკის წამება
            </a>

            <div class="navbar-nav ms-auto">

                <a class="nav-link" href="/">
                    დასაწყისი
                </a>

                <a class="nav-link" href="/introduction">
                    მიმოხილვა
                </a>

                <a class="nav-link active" href="/choice">
                    არჩევანი
                </a>

                <a class="nav-link" href="/characters">
                    პერსონაჟები
                </a>

                <a class="nav-link" href="/scale">
                    სასწორი
                </a>

            </div>

        </div>
    </nav>


    <!-- CHOICE -->

    <main class="container text-center choice-page">

        <p class="opening-label">
            მესამე არჩევანი
        </p>

        <h1>ძალაუფლება რომ გქონდეს, როგორ გამოიყენებდი?</h1>

        <p class="lead">
            აირჩიეთ მხოლოდ ერთი
        </p>


        <form method="POST" action="/question3">

            <div class="choice-grid">

                <button
                    type="submit"
                    name="choice"
                    value="ans1"
                    class="choice-card"
                >
                    <span>ჩემი ხალხის დასაცავად</span>
                </button>

                <button
                    type="submit"
                    name="choice"
                    value="ans2"
                    class="choice-card"
                >
                    <span>მხოლოდ მაშინ გამოვიყენებდი, როცა აუცილებელია</span>
                </button>

                <button
                    type="submit"
                    name="choice"
                    value="ans3"
                    class="choice-card"
                >
                    <span>წესრიგის შესანარჩუნებლად</span>
                </button>

                <button
                    type="submit"
                    name="choice"
                    value="ans4"
                    class="choice-card"
                >
                    <span>ჩემი გავლენის გასაზრდელად</span>
                </button>

            </div>

        </form>

    </main>

</body>
</html>
